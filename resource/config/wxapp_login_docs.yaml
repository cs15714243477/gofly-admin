  user_agreement_title: "用户服务协议" #用户协议标题
  user_agreement_content: |-
    <h1><b>《用户服务协议》</b></h1>
    <p>更新日期：2026年3月2日<br>生效日期：2026年3月2日</p>
    <p>欢迎使用本小程序。本小程序由快销房(沈阳)网络科技有限公司运营，主要提供房源浏览、信息展示与业务协作服务。</p>
    <p>在您使用本小程序前，请认真阅读并理解本协议全部内容。您点击“同意”并继续使用，即表示您已阅读、理解并同意接受本协议约束。</p>
    <h3><b>一、服务定位与适用范围</b></h3>
    <ol>
      <li>本小程序为内部业务协作工具，非面向不特定公众开放。</li>
      <li>未登录状态下，您可浏览部分公开/体验性内容。</li>
      <li>涉及个人中心、业务操作、数据提交等功能时，需您自主选择是否授权并登录。</li>
    </ol>
    <h3><b>二、账号与登录</b></h3>
    <ol>
      <li>为完成登录与账号识别，您可自主选择使用微信手机号授权登录。</li>
      <li>登录后，我们可能基于内部管理规则进行账号资格校验（如组织身份、角色权限等）。</li>
      <li>若校验未通过，您可能无法使用受限功能，但仍可在允许范围内浏览基础内容。</li>
    </ol>
    <h3><b>三、用户行为规范</b></h3>
    <ol>
      <li>您应合法、正当使用本小程序，不得利用本小程序从事违法违规活动。</li>
      <li>您不得上传、发布、传播违反法律法规或侵犯他人合法权益的信息。</li>
      <li>未经授权，您不得抓取、复制、传播本小程序内受保护的业务数据。</li>
    </ol>
    <h3><b>四、服务变更、中断与终止</b></h3>
    <ol>
      <li>我们可根据业务需要对功能进行调整、升级或维护。</li>
      <li>因系统维护、不可抗力、网络故障等导致服务中断的，我们将尽合理努力恢复。</li>
      <li>对违反本协议或不符合内部使用条件的账号，我们有权限制或终止其使用权限。</li>
    </ol>
    <h3><b>五、知识产权</b></h3>
    <ol>
      <li>本小程序中的页面设计、文案、图标、数据结构等内容，依法受知识产权保护。</li>
      <li>未经我们书面许可，任何单位或个人不得擅自使用、复制、修改或传播。</li>
    </ol>
    <h3><b>六、免责声明</b></h3>
    <ol>
      <li>本小程序按“现状”提供服务。</li>
      <li>在法律允许范围内，我们不对因您自身原因、第三方原因或不可抗力导致的损失承担责任。</li>
      <li>因您违规使用造成他人损害或平台损失的，应依法承担相应责任。</li>
    </ol>
    <h3><b>七、协议更新</b></h3>
    <ol>
      <li>我们可能根据业务和法律法规要求更新本协议。</li>
      <li>更新后的协议将在本小程序公示并标注生效日期。</li>
      <li>若您在更新后继续使用本小程序，视为您接受更新后的协议。</li>
    </ol>
    <h3><b>八、联系我们</b></h3>
    <p>运营主体：快销房(沈阳)网络科技有限公司<br>联系邮箱：1729917782@qq.com<br>联系电话：15714243477<br>联系地址：辽宁省沈阳市铁西区揽军路42-1号(2-7-2)</p>
