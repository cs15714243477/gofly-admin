  privacy_policy_title: "用户隐私政策" #隐私政策标题
  privacy_policy_content: |-
    <h1><b>《隐私政策》</b></h1>
    <p>更新日期：2026年3月2日<br>生效日期：2026年3月2日</p>
    <p>快销房(沈阳)网络科技有限公司非常重视您的个人信息与隐私保护。请您在使用本小程序前，仔细阅读并理解本政策全部内容。</p>
    <p><b>重要说明：</b></p>
    <ol>
      <li>在您未同意本政策前，我们不会基于登录目的收集您的手机号、头像、昵称等个人信息。</li>
      <li>您可先浏览体验功能，再自主选择是否授权登录。</li>
      <li>仅在实现明确业务目的所必需范围内收集和使用个人信息。</li>
    </ol>
    <h3><b>一、我们收集哪些信息</b></h3>
    <ol>
      <li>手机号码：用于登录认证、账号识别、内部人员身份核验、账号安全管理。</li>
      <li>微信头像、昵称：用于个人资料展示、账号识别与内部协作展示。</li>
      <li>使用与操作记录：用于功能实现、运营分析、问题排查与安全审计。</li>
      <li>设备与日志信息：用于保障服务稳定、安全风控、故障定位。</li>
    </ol>
    <h3><b>二、我们如何使用这些信息</b></h3>
    <ol>
      <li>提供并维护小程序核心功能。</li>
      <li>完成账号登录、内部权限校验和安全管理。</li>
      <li>优化产品体验与服务质量。</li>
      <li>满足法律法规要求及监管合规义务。</li>
    </ol>
    <h3><b>三、信息共享、转让、公开披露</b></h3>
    <ol>
      <li>我们不会向无关第三方出售您的个人信息。</li>
      <li>未经您同意，我们不会向第三方共享可识别您的个人信息，法律法规另有规定除外。</li>
      <li>如发生合并、分立、重组等情形导致信息转移，我们将要求接收方继续受本政策约束。</li>
      <li>我们仅在法律法规要求或监管机关依法要求时，进行必要披露。</li>
    </ol>
    <h3><b>四、信息存储与保护</b></h3>
    <ol>
      <li>存储地点：中华人民共和国境内。</li>
      <li>存储期限：为实现处理目的所需最短期限，或法律法规要求的期限。</li>
      <li>我们采取访问控制、传输加密、日志审计、权限管理等合理安全措施保护您的信息。</li>
    </ol>
    <h3><b>五、您的权利</b></h3>
    <ol>
      <li>查询、复制您的个人信息。</li>
      <li>更正、补充不准确或不完整的信息。</li>
      <li>删除个人信息（符合法定条件时）。</li>
      <li>撤回授权同意（撤回后不影响撤回前基于同意进行的处理）。</li>
      <li>注销账号（注销后我们将依法处理相关信息）。</li>
    </ol>
    <h3><b>六、未成年人保护</b></h3>
    <p>本小程序主要面向成年人内部业务人员。若您为未成年人，请在监护人指导下阅读并使用本小程序。</p>
    <h3><b>七、政策更新</b></h3>
    <ol>
      <li>我们可能根据业务变化或法律法规要求更新本政策。</li>
      <li>更新后将在小程序内公示并标注更新时间/生效时间。</li>
      <li>若更新涉及重大变化，我们将通过适当方式提示您。</li>
    </ol>
    <h3><b>八、联系我们</b></h3>
    <p>运营主体：快销房(沈阳)网络科技有限公司<br>联系邮箱：1729917782@qq.com<br>联系电话：15714243477<br>联系地址：辽宁省沈阳市铁西区揽军路42-1号(2-7-2)</p>
