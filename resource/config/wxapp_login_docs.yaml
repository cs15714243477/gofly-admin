  help_center_title: "帮助中心" #帮助中心标题
  help_center_content: |-
    <h2><b>《帮助中心》</b></h2>
    <p>更新时间：2026年3月2日<br>生效时间：2026年3月2日</p>
    <p>欢迎使用本小程序。为便于您快速上手，现将常见使用问题说明如下。</p>
    <h3><b>1. 小程序适用对象</b></h3>
    <p>本小程序为内部业务协作工具，主要面向内部授权人员使用。未登录用户可先浏览部分体验内容，受限功能需登录后使用。</p>
    <h3><b>2. 使用流程说明</b></h3>
    <ol>
      <li>进入小程序后，可先浏览首页/房源等基础内容。</li>
      <li>当您主动使用受限功能（如我的、业务管理、数据提交等）时，再根据提示选择是否授权登录。</li>
      <li>登录后系统将进行内部账号资格校验，通过后可使用完整功能。</li>
    </ol>
    <h3><b>3. 登录与授权说明</b></h3>
    <ol>
      <li>登录方式：微信手机号授权登录（用户自主选择）。</li>
      <li>授权目的：用于账号识别、内部权限校验、账号安全与业务服务。</li>
      <li>未授权影响：仍可浏览基础内容，但无法使用需要账号权限的功能。</li>
      <li>鉴权未通过：系统会提示当前账号暂无权限，您可联系管理员处理。</li>
    </ol>
    <h3><b>4. 为什么会提示权限不足</b></h3>
    <ol>
      <li>当前微信账号未绑定内部账号。</li>
      <li>账号角色未开通对应功能权限。</li>
      <li>账号状态异常（停用、过期、待审核等）。</li>
    </ol>
    <h3><b>5. 常见问题</b></h3>
    <p><b>Q1：不登录可以使用吗？</b><br>A：可以先浏览体验功能；受限功能需登录后使用。</p>
    <p><b>Q2：为什么需要手机号授权？</b><br>A：用于登录认证、账号唯一识别、权限校验和安全管理。</p>
    <p><b>Q3：登录后还是不能用某些功能？</b><br>A：可能是角色权限未开通，请联系管理员处理。</p>
    <p><b>Q4：如何查看《用户服务协议》和《隐私政策》？</b><br>A：可在登录页或相关入口查看完整内容后再决定是否授权登录。</p>
    <p><b>Q5：如何反馈问题？</b><br>A：请通过下方联系方式提交问题，我们会尽快处理。</p>
    <h3><b>6. 联系我们</b></h3>
    <p>运营主体：快销房(沈阳)网络科技有限公司<br>客服邮箱：1729917782@qq.com<br>联系电话：15714243477<br>服务时间：工作日早8晚5<br>联系地址：辽宁省沈阳市铁西区揽军路42-1号(2-7-2)</p>
    <h3><b>7. 温馨提示</b></h3>
    <p>请勿将账号出借他人使用。因账号外借导致的信息泄露或业务风险，需由账号持有人自行承担相应责任。</p>
